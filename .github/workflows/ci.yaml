name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      # passagemath (Maxima/FriCAS) is a required dependency, so this is
      # a large install; the pip cache speeds up later runs
      - run: pip install .[test]
      # python -m pytest (not plain pytest): imports the package from the
      # checkout, matching the doctests collected from it
      - run: python -m pytest -q
