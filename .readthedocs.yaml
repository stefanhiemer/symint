# .readthedocs.yaml
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # API pages are generated, not committed
    pre_build:
      - sphinx-apidoc -o docs/source/ symintegral --force --no-toc --separate

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
